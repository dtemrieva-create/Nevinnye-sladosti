let tg=null;function initTelegram(){const t=window.Telegram?.WebApp;if(!t||t.platform==='unknown')return;tg=t;function theme(){const p=t.themeParams;const r=document.documentElement;r.style.colorScheme=t.colorScheme;[['--bg',p.bg_color],['--card',p.secondary_bg_color||p.bg_color],['--ink',p.text_color],['--muted',p.hint_color]].forEach(([k,v])=>{if(v)r.style.setProperty(k,v)});r.style.setProperty('--line',t.colorScheme==='dark'?'#51465f':'#e4deeb')}theme();t.onEvent('themeChanged',theme);t.ready();t.expand()}
